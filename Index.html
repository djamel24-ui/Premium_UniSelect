        { name: "PhD in Medical Science", field: ProgramField.Medicine, level: StudyLevel.PhD, universityIds: ["um", "ukm", "usm", "imu", "uoc", "mahsa", "msu", "unikl", "ucsi", "taylors"] },

        // 12. ODL Business
        { name: "Bachelor of Business (ODL)", field: ProgramField.ODL, level: StudyLevel.Degree, universityIds: ["mediu", "oum", "aeu", "wou"] },
        { name: "Master of Business (ODL)", field: ProgramField.ODL, level: StudyLevel.Master, universityIds: ["mediu", "pbs", "unirazak", "alfa", "oum", "aeu", "wou"] },
        { name: "PhD in Business (ODL)", field: ProgramField.ODL, level: StudyLevel.PhD, universityIds: ["mediu", "pbs", "oum", "aeu"] },

        // 13. Petroleum
        { name: "Foundation in Science/Engineering (Petroleum focus)", field: ProgramField.Petroleum, level: StudyLevel.Foundation, universityIds: ["utp", "utm"] },
        { name: "Bachelor of Petroleum/Chemical Eng", field: ProgramField.Petroleum, level: StudyLevel.Degree, universityIds: ["utp", "utm", "ump", "ucsi", "curtin"] },
        { name: "Master of Petroleum Engineering", field: ProgramField.Petroleum, level: StudyLevel.Master, universityIds: ["utp", "utm", "ump", "ucsi", "curtin"] },
        { name: "PhD in Petroleum Engineering", field: ProgramField.Petroleum, level: StudyLevel.PhD, universityIds: ["utp", "utm", "ump", "ucsi", "curtin"] },

        // 14. Pre-U (Specific)
        { name: "Foundation in Science/Arts", field: ProgramField.PreU, level: StudyLevel.Foundation, universityIds: ["um", "apu", "mmu", "uitm", "uniten", "taylors", "sunway", "monash", "nottingham", "ucsi", "help", "inti", "segi"] },

        // 15. Science
        { name: "Foundation in Science", field: ProgramField.Science, level: StudyLevel.Foundation, universityIds: ["usm", "um", "ukm", "upm", "unisel", "ucsi", "taylors", "sunway", "monash", "nottingham", "imu"] },
        { name: "Diploma in Science/Biotech", field: ProgramField.Science, level: StudyLevel.Diploma, universityIds: ["unisel", "ucsi", "msu", "nilai"] },
        { name: "Bachelor of Science/Biotech", field: ProgramField.Science, level: StudyLevel.Degree, universityIds: ["usm", "um", "ukm", "upm", "unisel", "ucsi", "taylors", "monash", "nottingham", "swinburne", "curtin"] },
        { name: "Master of Science", field: ProgramField.Science, level: StudyLevel.Master, universityIds: ["usm", "um", "ukm", "upm", "unisel", "ucsi", "taylors", "monash", "nottingham"] },
        { name: "PhD in Science", field: ProgramField.Science, level: StudyLevel.PhD, universityIds: ["usm", "um", "ukm", "upm", "unisel", "ucsi", "taylors", "monash", "nottingham"] }
      ].map((p, index) => ({ ...p, id: `prog_${index}` })); // Add IDs dynamically

      const CountryFilter = {
        All: "All",
        Oman: "Oman",
        UAE: "UAE",
        Iraq: "Iraq",
        Saudi: "Saudi"
      };

      // --- COMPONENT: Header ---
      const Header = ({ isArabic, setIsArabic }) => {
        
        const toggleLanguage = () => {
            setIsArabic(!isArabic);
            // Toggle RTL on Body
            document.body.dir = !isArabic ? 'rtl' : 'ltr';
            document.documentElement.lang = !isArabic ? 'ar' : 'en';
            document.body.classList.toggle('font-arabic', !isArabic);
        };

        const text = isArabic ? t.ar : t.en;

        return (
          <header className="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50 glass-panel">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
              <div className="flex items-center justify-between gap-4">
                <div className="flex items-center gap-4">
                  <img 
                      src="https://marine-white-7l1epbg2wn.edgeone.app/cropped-Untitled-design-1_prev_ui-removebg-preview.png" 
                      alt="Premium UniSelect Logo" 
                      className="h-12 w-auto object-contain"
                  />
                  <div>
                    <h1 className="text-xl font-bold text-slate-900 leading-none tracking-tight">{text.appTitle}</h1>
                    <p className="text-xs text-slate-500 mt-1 font-medium">{text.subTitle}</p>
                  </div>
                </div>
                
                <div className="flex items-center gap-3">
                   <div className="hidden sm:block text-xs font-medium text-slate-500 bg-slate-50 px-3 py-1 rounded-full border border-slate-200">
                      {text.malaysiaHigherEd}
                   </div>
                   
                   <button 
                      onClick={toggleLanguage}
                      className={`
                        flex items-center gap-2 px-3 py-1.5 rounded-lg border text-sm font-medium transition-all
                        ${isArabic 
                            ? 'bg-gold-500 text-white border-gold-600 hover:bg-gold-600' 
                            : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'}
                      `}
                   >
                     <Languages className="w-4 h-4" />
                     {isArabic ? 'English' : 'العربية'}
                   </button>
                </div>
              </div>
            </div>
          </header>
        );
      };

      // --- COMPONENT: FilterBar ---
      const FilterBar = ({ 
        searchQuery, setSearchQuery, 
        selectedField, setSelectedField,
        selectedLevel, setSelectedLevel,
        selectedCountry, setSelectedCountry,
        showPartnersOnly, setShowPartnersOnly,
        isArabic
      }) => {
        const text = isArabic ? t.ar : t.en;
        
        return (
          <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-8 transition-all duration-300 hover:shadow-md">
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-12 gap-4">
              
              {/* Search (3 cols) */}
              <div className="relative lg:col-span-3">
                <div className={`absolute inset-y-0 ${isArabic ? 'right-0 pr-3' : 'left-0 pl-3'} flex items-center pointer-events-none`}>
                  <SearchIcon className="h-5 w-5 text-slate-400" />
                </div>
                <input
                  type="text"
                  className={`block w-full ${isArabic ? 'pr-10 pl-3' : 'pl-10 pr-3'} py-2.5 border border-slate-300 rounded-lg leading-5 bg-slate-50 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm transition duration-150 ease-in-out`}
                  placeholder={text.searchPlaceholder}
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                />
              </div>

              {/* Field Filter (2 cols) */}
              <div className="relative lg:col-span-2">
                <div className={`absolute inset-y-0 ${isArabic ? 'right-0 pr-3' : 'left-0 pl-3'} flex items-center pointer-events-none`}>
                  <FilterIcon className="h-5 w-5 text-slate-400" />
                </div>
                <select
                  className={`block w-full ${isArabic ? 'pr-10 pl-8' : 'pl-10 pr-8'} py-2.5 border border-slate-300 rounded-lg leading-5 bg-slate-50 focus:outline-none focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm appearance-none cursor-pointer truncate`}
                  value={selectedField}
                  onChange={(e) => setSelectedField(e.target.value)}
                >
                  <option value="All">{text.allFields}</option>
                  {Object.entries(ProgramField).map(([key, val]) => (
                    <option key={key} value={val}>{isArabic ? ProgramFieldAr[val] : val}</option>
                  ))}
                </select>
              </div>

              {/* Level Filter (2 cols) */}
              <div className="relative lg:col-span-2">
                <div className={`absolute inset-y-0 ${isArabic ? 'right-0 pr-3' : 'left-0 pl-3'} flex items-center pointer-events-none`}>
                  <BookOpen className="h-5 w-5 text-slate-400" />
                </div>
                <select
                  className={`block w-full ${isArabic ? 'pr-10 pl-8' : 'pl-10 pr-8'} py-2.5 border border-slate-300 rounded-lg leading-5 bg-slate-50 focus:outline-none focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm appearance-none cursor-pointer truncate`}
                  value={selectedLevel}
                  onChange={(e) => setSelectedLevel(e.target.value)}
                >
                  <option value="All">{text.allLevels}</option>
                  {Object.entries(StudyLevel).map(([key, val]) => (
                    <option key={key} value={val}>{isArabic ? StudyLevelAr[val] : val}</option>
                  ))}
                </select>
              </div>

              {/* Country Filter (3 cols) */}
              <div className="relative lg:col-span-3">
                 <div className={`absolute inset-y-0 ${isArabic ? 'right-0 pr-3' : 'left-0 pl-3'} flex items-center pointer-events-none`}>
                  <GlobeIcon className="h-5 w-5 text-slate-400" />
                </div>
                <select
                  className={`block w-full ${isArabic ? 'pr-10 pl-8' : 'pl-10 pr-8'} py-2.5 border border-slate-300 rounded-lg leading-5 bg-slate-50 focus:outline-none focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm appearance-none cursor-pointer`}
                  value={selectedCountry}
                  onChange={(e) => setSelectedCountry(e.target.value)}
                >
                  <option value={CountryFilter.All}>{text.allCountries}</option>
                  <option value={CountryFilter.Oman}>{text.omanAccredited}</option>
                  <option value={CountryFilter.UAE}>{text.uaeAccredited}</option>
                  <option value={CountryFilter.Iraq}>{text.iraqAccredited}</option>
                  <option value={CountryFilter.Saudi}>{text.saudiAccredited}</option>
                </select>
              </div>

              {/* Partner Toggle (2 cols) */}
              <div className="lg:col-span-2 flex">
                <div 
                  onClick={() => setShowPartnersOnly(!showPartnersOnly)}
                  className={`w-full flex items-center justify-center gap-2 px-4 py-2 rounded-lg border cursor-pointer transition-all duration-200 select-none ${
                    showPartnersOnly 
                      ? 'bg-emerald-50 border-emerald-200 text-emerald-700 shadow-inner' 
                      : 'bg-white border-slate-300 text-slate-600 hover:bg-slate-50'
                  }`}
                >
                  <CheckCircle className={`w-5 h-5 ${showPartnersOnly ? 'fill-emerald-500 text-white' : 'text-slate-400'}`} />
                  <span className="font-medium text-sm whitespace-nowrap">{text.partnersOnly}</span>
                </div>
              </div>
            </div>
            
            {selectedCountry === CountryFilter.Oman && (
              <div className="mt-4 p-4 bg-amber-50 border border-amber-200 rounded-lg text-sm text-amber-900 flex items-start gap-3 animate-fade-in">
                 <AlertTriangle className="w-5 h-5 text-amber-600 flex-shrink-0 mt-0.5" />
                 <div className="flex-1">
                   <span className="font-bold block mb-1 text-amber-800">{text.omanWarningTitle}</span>
                   <ul className={`list-disc ${isArabic ? 'pr-4' : 'pl-4'} space-y-1 text-amber-900/80 text-xs sm:text-sm`}>
                     <li>{text.omanWarning1}</li>
                     <li>{text.omanWarning2}</li>
                     <li>{text.omanWarning3}</li>
                     <li>{text.omanWarning4}</li>
                   </ul>
                 </div>
              </div>
            )}

            {selectedCountry === CountryFilter.UAE && (
              <div className="mt-4 p-4 bg-blue-50 border border-blue-200 rounded-lg text-sm text-blue-900 flex items-start gap-3 animate-fade-in">
                 <AlertTriangle className="w-5 h-5 text-blue-600 flex-shrink-0 mt-0.5" />
                 <div className="flex-1">
                   <span className="font-bold block mb-1 text-blue-800">{text.uaeWarningTitle}</span>
                   <ul className={`list-disc ${isArabic ? 'pr-4' : 'pl-4'} space-y-1 text-blue-900/80 text-xs sm:text-sm`}>
                     <li>{text.uaeWarning1}</li>
                     <li>{text.uaeWarning2}</li>
                     <li>{text.uaeWarning3}</li>
                   </ul>
                 </div>
              </div>
            )}

             {selectedCountry === CountryFilter.Iraq && (
              <div className="mt-4 p-4 bg-emerald-50 border border-emerald-200 rounded-lg text-sm text-emerald-900 flex items-start gap-3 animate-fade-in">
                 <AlertTriangle className="w-5 h-5 text-emerald-600 flex-shrink-0 mt-0.5" />
                 <div className="flex-1">
                   <span className="font-bold block mb-1 text-emerald-800">{text.iraqWarningTitle}</span>
                   <ul className={`list-disc ${isArabic ? 'pr-4' : 'pl-4'} space-y-1 text-emerald-900/80 text-xs sm:text-sm`}>
                     <li>{text.iraqWarning1}</li>
                     <li>{text.iraqWarning2}</li>
                     <li>{text.iraqWarning3}</li>
                   </ul>
                 </div>
              </div>
            )}

             {selectedCountry === CountryFilter.Saudi && (
              <div className="mt-4 p-4 bg-teal-50 border border-teal-200 rounded-lg text-sm text-teal-900 flex items-start gap-3 animate-fade-in">
                 <AlertTriangle className="w-5 h-5 text-teal-600 flex-shrink-0 mt-0.5" />
                 <div className="flex-1">
                   <span className="font-bold block mb-1 text-teal-800">{text.saudiWarningTitle}</span>
                   <ul className={`list-disc ${isArabic ? 'pr-4' : 'pl-4'} space-y-1 text-teal-900/80 text-xs sm:text-sm`}>
                     <li>{text.saudiWarning1}</li>
                     <li>{text.saudiWarning2}</li>
                     <li>{text.saudiWarning3}</li>
                   </ul>
                 </div>
              </div>
            )}
          </div>
        );
      };

      // --- MAIN APP ---
      const App = () => {
        const [searchQuery, setSearchQuery] = useState('');
        const [selectedField, setSelectedField] = useState('All');
        const [selectedLevel, setSelectedLevel] = useState('All');
        const [selectedCountry, setSelectedCountry] = useState(CountryFilter.All);
        const [showPartnersOnly, setShowPartnersOnly] = useState(false);
        const [isArabic, setIsArabic] = useState(false);

        const text = isArabic ? t.ar : t.en;

        const filteredData = useMemo(() => {
          const query = searchQuery.toLowerCase();

          return programs.map(program => {
            // 1. Check Field
            if (selectedField !== 'All' && program.field !== selectedField) return null;

            // 2. Check Level
            if (selectedLevel !== 'All' && program.level !== selectedLevel) return null;

            // 3. Filter Universities within the program
            const uniqueUniIds = [...new Set(program.universityIds)]; // Deduplicate IDs
            
            const validUniversities = uniqueUniIds.map(uniId => {
              const uni = universities[uniId];
              if (!uni) return null; 

              // Get localized names
              const pName = isArabic ? (ProgramNameAr[program.name] || program.name) : program.name;
              const uName = isArabic ? (uni.nameAr || uni.name) : uni.name;

              // Search Filter
              const matchesSearch = pName.toLowerCase().includes(query) || uName.toLowerCase().includes(query);
              if (!matchesSearch) return null;

              // Partner Filter
              if (showPartnersOnly && !uni.isPartner) return null;

              // Country Accreditation Filter (Oman Logic)
              if (selectedCountry === CountryFilter.Oman) {
                  const accData = uni.accreditation['Oman'];
                  if (!accData || !accData.isAccredited) return null;

                  // The logic: MBBS/MD is blocked for Degree level. PhD/Masters in Med is allowed.
                  // Check if this specific program is a Bachelor of Medicine
                  const isBachelorMedicine = (program.name === "Bachelor of Medicine (MBBS/MD)" && program.level === StudyLevel.Degree);
                  
                  if (isBachelorMedicine) return null;

                  if (accData.restrictedPrograms && accData.restrictedPrograms.length > 0) {
                      const levelName = program.level.toLowerCase();
                      const progName = program.name.toLowerCase();
                      const isRestricted = accData.restrictedPrograms.some(keyword => 
                          levelName.includes(keyword) || progName.includes(keyword)
                      );
                      if (isRestricted) return null;
                  }
              }

              // Country Accreditation Filter (UAE Logic)
              if (selectedCountry === CountryFilter.UAE) {
                  const accData = uni.accreditation['UAE'];
                  if (!accData || !accData.isAccredited) return null;
              }

              // Country Accreditation Filter (Iraq Logic)
              if (selectedCountry === CountryFilter.Iraq) {
                  const accData = uni.accreditation['Iraq'];
                  if (!accData || !accData.isAccredited) return null;
              }

               // Country Accreditation Filter (Saudi Logic)
              if (selectedCountry === CountryFilter.Saudi) {
                  const accData = uni.accreditation['Saudi'];
                  if (!accData || !accData.isAccredited) return null;
              }

              return uni;
            }).filter(Boolean);

            if (validUniversities.length === 0) return null;

            return { ...program, validUniversities };
          }).filter(Boolean);
        }, [searchQuery, selectedField, selectedLevel, selectedCountry, showPartnersOnly, isArabic]);

        return (
          <div className="min-h-screen flex flex-col bg-slate-50" dir={isArabic ? 'rtl' : 'ltr'}>
            <Header isArabic={isArabic} setIsArabic={setIsArabic} />
            
            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
              <FilterBar 
                searchQuery={searchQuery}
                setSearchQuery={setSearchQuery}
                selectedField={selectedField}
                setSelectedField={setSelectedField}
                selectedLevel={selectedLevel}
                setSelectedLevel={setSelectedLevel}
                selectedCountry={selectedCountry}
                setSelectedCountry={setSelectedCountry}
                showPartnersOnly={showPartnersOnly}
                setShowPartnersOnly={setShowPartnersOnly}
                isArabic={isArabic}
              />

              <div className="space-y-6">
                {filteredData.length > 0 ? (
                  filteredData.map((item) => {
                    const displayName = isArabic ? (ProgramNameAr[item.name] || item.name) : item.name;
                    const displayLevel = isArabic ? (StudyLevelAr[item.level] || item.level) : item.level;
                    const displayField = isArabic ? (ProgramFieldAr[item.field] || item.field) : item.field;

                    return (
                    <div key={item.id} className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-all duration-200">
                      <div className="px-6 py-4 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center flex-wrap gap-2">
                        <div className="flex items-center gap-3">
                            <h2 className="text-lg font-bold text-slate-800">
                            {displayName}
                            </h2>
                            <span className={`px-2.5 py-1 text-xs font-bold rounded border uppercase tracking-wider ${
                                item.level.includes('PhD') || item.level.includes('Doctorate') ? 'bg-purple-50 text-purple-700 border-purple-200' :
                                item.level.includes('Master') ? 'bg-indigo-50 text-indigo-700 border-indigo-200' :
                                item.level.includes('Bachelor') || item.level.includes('Degree') || item.level.includes('MBBS') || item.level.includes('BBA') ? 'bg-blue-50 text-blue-700 border-blue-200' :
                                'bg-slate-100 text-slate-600 border-slate-200'
                            }`}>
                                {displayLevel}
                            </span>
                        </div>
                        <span className="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 border border-slate-200">
                          {displayField}
                        </span>
                      </div>
                      
                      <div className="p-6">
                        <div className="flex flex-wrap gap-3">
                          {item.validUniversities.map((uni) => {
                              const isOman = selectedCountry === CountryFilter.Oman;
                              const accNote = isOman ? uni.accreditation['Oman']?.notes : null;
                              const uniName = isArabic ? (uni.nameAr || uni.name) : uni.name;

                              return (
                                <a 
                                  key={uni.id} 
                                  href={uni.url} 
                                  target="_blank" 
                                  rel="noopener noreferrer"
                                  className={`
                                    group relative flex items-center gap-2 px-4 py-2.5 rounded-lg border text-sm font-medium transition-all duration-200
                                    ${uni.isPartner 
                                      ? 'bg-white border-emerald-200 text-slate-700 hover:border-emerald-500 hover:shadow-sm hover:text-emerald-700' 
                                      : 'bg-slate-50 border-slate-200 text-slate-500 hover:bg-white hover:border-blue-400 hover:text-blue-600'}
                                  `}
                                >
                                  {uni.isPartner && (
                                      <Check className="w-4 h-4 text-emerald-500" />
                                  )}
                                  {uniName}
                                  {accNote && (
                                      <span className="ml-1 text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded border border-amber-200 whitespace-nowrap">
                                          {accNote}
                                      </span>
                                  )}
                                  <ExternalLink className="w-3 h-3 opacity-0 group-hover:opacity-100 transition-opacity" />
                                  
                                  {uni.isPartner && (
                                      <span className={`absolute -top-1 ${isArabic ? '-left-1' : '-right-1'} flex h-2.5 w-2.5`}>
                                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                        <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                                      </span>
                                  )}
                                </a>
                              );
                          })}
                        </div>
                      </div>
                    </div>
                  )})
                ) : (
                  <div className="text-center py-24 bg-white rounded-xl border border-slate-200 border-dashed">
                      <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-50 mb-4">
                          <AlertTriangle className="w-8 h-8 text-slate-400" />
                      </div>
                      <h3 className="text-lg font-semibold text-slate-900">{text.noResults}</h3>
                      <p className="text-slate-500 mt-2 max-w-sm mx-auto">
                        {text.tryAdjusting}
                      </p>
                      
                      {/* Specific Hint for Oman Medicine */}
                      {selectedCountry === CountryFilter.Oman && selectedField === ProgramField.Medicine && selectedLevel === StudyLevel.Degree && (
                          <div className="mt-6 max-w-lg mx-auto bg-red-50 border border-red-200 p-4 rounded-lg text-left shadow-sm">
                            <p className="text-red-800 font-semibold text-sm flex items-center gap-2">
                                <AlertTriangle className="w-4 h-4"/> {text.cantSeeMedicine}
                            </p>
                            <p className="text-red-700 text-sm mt-2 leading-relaxed">
                                {text.cantSeeMedicineDesc}
                            </p>
                            <div className="mt-3 pt-3 border-t border-red-200/60">
                                <p className="text-xs text-red-600/80">
                                    {text.cantSeeMedicineTip}
                                </p>
                            </div>
                          </div>
                      )}
                  </div>
                )}
              </div>
            </main>

            <footer className="bg-slate-900 text-slate-400 py-10 mt-12 border-t border-slate-800">
              <div className="max-w-7xl mx-auto px-4 text-center">
                  <div className="flex justify-center items-center gap-2 mb-4">
                    <GraduationCap className="w-6 h-6 text-slate-600" />
                    <span className="font-bold text-slate-300">{text.appTitle}</span>
                  </div>
                  <p className="text-sm">© {new Date().getFullYear()} {text.rightsReserved}</p>
                  <p className="text-xs mt-3 opacity-50 max-w-2xl mx-auto leading-relaxed">
                    {text.footerDisclaimer}
                  </p>
              </div>
            </footer>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>

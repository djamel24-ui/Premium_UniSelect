<head>
<meta charset="UTF-8" />

<style>
/* ==========================================================
   GLOBAL RESET & VARIABLES
   ========================================================== */
:root {
  --bg: #f6f8fa;
  --text: #1a1a1a;
  --card-bg: #ffffff;
  --card-border: #dcdcdc;
  --primary: #0066ff;
  --primary-hover: #004ecc;
  --shadow: rgba(0,0,0,0.08);
  --secondary-text: #666666;
}

.dark {
  --bg: #0f172a;
  --text: #e2e8f0;
  --card-bg: #1e293b;
  --card-border: #334155;
  --primary: #38bdf8;
  --primary-hover: #0ea5e9;
  --shadow: rgba(255,255,255,0.05);
  --secondary-text: #94a3b8;
}

body, html {
  margin: 0;
  padding: 0;
  font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background 0.3s ease-in-out, color 0.3s ease-in-out;
}

/* ==========================================================
   CONTAINER
   ========================================================== */
.app-container {
  max-width: 1100px;
  margin: auto;
  padding: 40px 20px;
}

/* ==========================================================
   HEADER + LOGO
   ========================================================== */
.header-box {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

.header-logo {
  width: 60px;
  height: 60px;
  object-fit: contain;
}

.header-title {
  font-size: 28px;
  font-weight: 700;
  margin: 0;
}

.subtitle {
  font-size: 16px;
  opacity: 0.8;
  margin-bottom: 25px;
}

/* ==========================================================
   LANGUAGE + DARK MODE BUTTONS
   ========================================================== */
.controls-row {
  display: flex;
  gap: 10px;
  margin-bottom: 25px;
}

.lang-btn, .mode-btn {
  background: var(--primary);
  border: none;
  padding: 10px 18px;
  color: white;
  font-size: 14px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
  font-weight: 500;
}

.lang-btn:hover, .mode-btn:hover {
  background: var(--primary-hover);
  transform: translateY(-1px);
}

/* ==========================================================
   SEARCH + SELECT INPUTS
   ========================================================== */
.input-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 4px 12px var(--shadow);
  margin-bottom: 20px;
}

.input-label {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 8px;
  display: block;
  color: var(--text);
}

.input-box, .select-box {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--card-border);
  background: var(--card-bg);
  color: var(--text);
  font-size: 14px;
  box-sizing: border-box;
  margin-bottom: 15px;
}

.input-box:focus, .select-box:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
}

/* ==========================================================
   FILTER / SORT BAR
   ========================================================== */
.filter-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 25px;
  margin-bottom: 15px;
  flex-wrap: wrap;
  gap: 10px;
}

.sort-wrapper {
  display: flex;
  align-items: center;
  gap: 10px;
}

.sort-select {
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--card-border);
  background: var(--card-bg);
  color: var(--text);
  font-size: 14px;
}

/* ==========================================================
   RESULT TITLE
   ========================================================== */
.result-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  margin: 0;
}

.result-highlight {
  color: var(--primary);
}

/* ==========================================================
   UNIVERSITY CARDS GRID
   ========================================================== */
.uni-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 18px;
  margin-top: 20px;
}

.uni-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 4px 10px var(--shadow);
  transition: all 0.2s ease;
  display: flex;
  flex-direction: column;
}

.uni-card:hover {
  transform: translateY(-3px);
  border-color: var(--primary);
  box-shadow: 0 6px 16px var(--shadow);
}

.uni-name {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 10px;
  color: var(--primary);
}

.uni-small {
  font-size: 13px;
  color: var(--secondary-text);
  margin-bottom: 5px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.uni-small strong {
  font-weight: 600;
}

/* ==========================================================
   WEBSITE LINK BUTTON
   ========================================================== */
.website-link {
  display: inline-block;
  margin-top: auto; /* Pushes button to the bottom */
  padding: 8px 14px;
  background: var(--primary);
  color: white;
  text-decoration: none;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  transition: 0.2s;
  text-align: center;
}

.website-link:hover {
  background: var(--primary-hover);
  transform: translateY(-1px);
}

/* ==========================================================
   PRICE BADGE
   ========================================================== */
.price-tag {
  margin-top: 12px;
  margin-bottom: 15px;
  display: inline-block;
  background: var(--primary);
  color: white;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
}

/* ==========================================================
   EMPTY RESULT MESSAGE
   ========================================================== */
.no-result {
  color: #ef4444;
  font-size: 14px;
  margin-top: 20px;
  text-align: center;
  padding: 20px;
  background: rgba(239, 68, 68, 0.1);
  border-radius: 10px;
}

.info-message {
  color: var(--text);
  opacity: 0.6;
  font-size: 14px;
  margin-top: 20px;
  text-align: center;
  padding: 20px;
}

/* ==========================================================
   RTL SUPPORT FOR ARABIC
   ========================================================== */
.rtl {
  direction: rtl;
  text-align: right;
}

.ltr {
  direction: ltr;
  text-align: left;
}

/* ==========================================================
   RESPONSIVE
   ========================================================== */
@media (max-width: 768px) {
  .header-title {
    font-size: 22px;
  }
  
  .uni-grid {
    grid-template-columns: 1fr;
  }
  
  .controls-row {
    flex-direction: column;
  }
  
  .filter-bar {
    flex-direction: column;
    align-items: flex-start;
  }
  
  .sort-wrapper {
    width: 100%;
    justify-content: space-between;
  }
  
  .sort-select {
    flex: 1;
  }
}
</style>
</head>

/* ============================================
   KEYWORD EXPANSION (GOOGLE-STYLE)
============================================ */
function expandKeywords(text) {
  const expansionMap = {
    "master": "postgraduate",
    "ماجستير": "دراسات عليا",
    "bachelor": "degree",
    "degree": "bachelor",
    "بكالوريوس": "درجة جامعية",
    "engineering": "engineer",
    "engineer": "engineering",
    "هندسة": "مهندس",
  };

  let words = text.split(" ");
  words.forEach(w => {
    if (expansionMap[w]) {
      words.push(expansionMap[w]);
    }
  });

  return words.join(" ");
}

/* ============================================
   ADVANCED SYNONYM RESOLUTION
============================================ */
function resolveSynonym(input) {
  let txt = input.toLowerCase().trim();

  // 1. Expand using keyword expansion
  txt = expandKeywords(txt);

  // 2. Direct exact match
  if (synonyms[txt]) return synonyms[txt];

  // 3. Partial fuzzy match
  for (let key in synonyms) {
    if (txt.includes(key)) return synonyms[key];
  }

  // 4. Arabic normalized search
  let arabicNorm = txt.replace(/[أإآ]/g, "ا");
  for (let key in synonyms) {
    let keyNorm = key.replace(/[أإآ]/g, "ا");
    if (arabicNorm.includes(keyNorm)) return synonyms[key];
  }

  // 5. No match → return original text
  return input;
}

// Collect all programme names from rawData
const allProgrammes = Array.from(
  new Set(
    rawData.flatMap(u => Object.keys(u.programmes))
  )
).sort();

// Helper function to translate labels using PROGRAMME_LABELS
function translateLabel(label, lang) {
  if (!PROGRAMME_LABELS[label]) return label;
  return lang === "en" ? PROGRAMME_LABELS[label].en : PROGRAMME_LABELS[label].ar;
}

// ==========================================================
//     MAIN REACT APPLICATION (UI + Logic)
// ==========================================================

function App() {
  const [search, setSearch] = React.useState("");
  const [selectedProgramme, setSelectedProgramme] = React.useState("");
  const [sortOption, setSortOption] = React.useState("default"); // 'default', 'price', 'duration', 'type'
  const [lang, setLang] = React.useState("en");
  const [darkMode, setDarkMode] = React.useState(false);

  // Translate helper
  const t = (en, ar) => (lang === "en" ? en : ar);

  // Apply synonym resolution to search text
  const resolvedSearch = React.useMemo(() => {
    if (!search.trim()) return "";
    return resolveSynonym(search);
  }, [search]);

  // Filter programme list based on resolved search
  const filteredProgrammes = React.useMemo(() => {
    if (!resolvedSearch) return allProgrammes;
    
    // Check if resolved search matches a programme key
    const exactMatch = allProgrammes.find(p => p === resolvedSearch);
    if (exactMatch) {
      // If a match is found, automatically select it
      setSelectedProgramme(exactMatch);
      return [exactMatch];
    }
    
    // Otherwise filter by translated label
    return allProgrammes.filter((p) =>
      translateLabel(p, lang).toLowerCase().includes(resolvedSearch.toLowerCase())
    );
  }, [resolvedSearch, lang]);

  // Find and Sort universities that offer selected programme
  const matchingUniversities = React.useMemo(() => {
    if (!selectedProgramme) return [];

    // 1. Filter
    let data = rawData.filter((u) => {
      const entry = u.programmes[selectedProgramme];
      return entry && entry.available === true;
    });

    // 2. Sort
    if (sortOption === "default") return data;

    return data.sort((a, b) => {
      const entryA = a.programmes[selectedProgramme];
      const entryB = b.programmes[selectedProgramme];

      // Helper to parse price
      const getPrice = (entry) => {
        if (!entry.price) return Infinity;
        // Remove commas and convert to float. If 'X' or NaN, return Infinity
        const val = parseFloat(entry.price.replace(/,/g, '').replace(/[^\d.]/g, ''));
        return isNaN(val) ? Infinity : val;
      };

      // Helper to parse duration
      const getDuration = (uniShortName) => {
        const idx = UNI_INDEX_MAP[uniShortName];
        if (idx === undefined) return Infinity;
        const str = getMatrixData(DURATION_MATRIX, selectedProgramme, idx);
        
        if (!str || str === "N/A" || str === "Check Website" || str === "Via Sci") return Infinity;
        
        // Handle ranges "1.5 - 2" -> take 1.5
        const match = str.match(/[\d\.]+/);
        return match ? parseFloat(match[0]) : Infinity;
      };

      if (sortOption === "price") {
        return getPrice(entryA) - getPrice(entryB);
      }

      if (sortOption === "duration") {
        return getDuration(a.shortName) - getDuration(b.shortName);
      }

      if (sortOption === "type") {
        const typeA = universityTypes[a.shortName] || a.type;
        const typeB = universityTypes[b.shortName] || b.type;
        return typeA.localeCompare(typeB);
      }

      return 0;
    });
  }, [selectedProgramme, sortOption]);

  return (
    <div className={darkMode ? "dark" : ""}>
      <div className="app-container">

        {/* HEADER */}
        <div className="header-box">
          <img className="header-logo"
              src="https://marine-white-7l1epbg2wn.edgeone.app/cropped-Untitled-design-1_prev_ui-removebg-preview.png" 
              alt="Logo" />
          <h1 className="header-title">{t("Malaysia University Programme Finder",
                 "البحث عن البرامج الجامعية في ماليزيا")}</h1>
        </div>

        <p className="subtitle">
          {t(
            "Choose a programme and see all universities that offer it.",
            "اختر برنامجًا لرؤية الجامعات التي تقدمه."
          )}
        </p>

        {/* TOGGLE BUTTONS */}
        <div className="controls-row">
          <button
            className="lang-btn"
            onClick={() => setLang(lang === "en" ? "ar" : "en")}
          >
            {t("عربي", "English")}
          </button>

          <button
            className="mode-btn"
            onClick={() => setDarkMode(!darkMode)}
          >
            {darkMode ? t("Light Mode", "وضع النهار") : t("Dark Mode", "وضع الليل")}
          </button>
        </div>

        {/* SEARCH AREA */}
        <div className="input-card">
          <label className="input-label">{t("Search Programme", "ابحث عن برنامج")}</label>
          <input
            className="input-box"
            type="text"
            placeholder={t("Type programme name (e.g., doctor, engineering, IT)…", "اكتب اسم البرنامج (مثل: طبيب، هندسة، تقنية معلومات)…")}
            value={search}
            onChange={(e) => setSearch(e.target.value)}
          />

          <label className="input-label">
            {t("Select Programme", "اختر البرنامج")}
          </label>
          <select
            className="select-box"
            value={selectedProgramme}
            onChange={(e) => setSelectedProgramme(e.target.value)}
          >
            <option value="">
              {t("Choose…", "اختر…")}
            </option>

            {filteredProgrammes.map((p) => (
              <option key={p} value={p}>
                {translateLabel(p, lang)}
              </option>
            ))}
          </select>
        </div>

        {/* RESULTS TITLE & SORT BAR */}
        <div className="filter-bar">
           <h2 className="result-title">
             {t("Universities offering:", "الجامعات التي تقدم:")}{" "}
             <span className="result-highlight">
               {selectedProgramme ? translateLabel(selectedProgramme, lang) : ""}
             </span>
           </h2>

           {selectedProgramme && matchingUniversities.length > 0 && (
             <div className="sort-wrapper">
               <span className="input-label" style={{marginBottom:0}}>
                 {t("Sort By:", "ترتيب حسب:")}
               </span>
               <select 
                 className="sort-select"
                 value={sortOption}
                 onChange={(e) => setSortOption(e.target.value)}
               >
                 <option value="default">{t("Default", "افتراضي")}</option>
                 <option value="price">{t("Price (Low to High)", "السعر (من الأقل للأعلى)")}</option>
                 <option value="duration">{t("Duration (Shortest)", "المدة (الأقصر)")}</option>
                 <option value="type">{t("Type (Public/Private)", "النوع (حكومي/خاص)")}</option>
               </select>
             </div>
           )}
        </div>

        {/* RESULTS AREA */}
        {!selectedProgramme ? (
          <p className="info-message">
            {t("Please choose a programme.", "يرجى اختيار برنامج.")}
          </p>
        ) : matchingUniversities.length === 0 ? (
          <p className="no-result">
            {t("No matching universities found.", "لا توجد جامعات مطابقة.")}
          </p>
        ) : (
          <div className="uni-grid">
            {matchingUniversities.map((u) => {
              const entry = u.programmes[selectedProgramme];
              
              // Lookup new data from matrices
              const uniIdx = UNI_INDEX_MAP[u.shortName];
              const duration = (uniIdx !== undefined) 
                ? getMatrixData(DURATION_MATRIX, selectedProgramme, uniIdx) 
                : "N/A";
              const ielts = (uniIdx !== undefined) 
                ? getMatrixData(IELTS_MATRIX, selectedProgramme, uniIdx) 
                : "N/A";

              return (
                <div key={u.university} className="uni-card">
                  <div className="uni-name">{u.university}</div>

                  {/* Short Name & Currency Removed */}
                  
                  <div className="uni-small">
                    {t("Type", "النوع")}: {universityTypes[u.shortName] || u.type}
                  </div>

                  {/* New Duration Field */}
                  <div className="uni-small">
                    <strong>{t("Duration", "المدة")}:</strong> {duration} {duration !== "N/A" && duration !== "Check Website" ? t("Years", "سنوات") : ""}
                  </div>
                  
                  {/* New IELTS Field */}
                  <div className="uni-small">
                    <strong>{t("IELTS", "الآيلتس")}:</strong> {ielts}
                  </div>

                  {/* PRICE */}
                  <div className="price-tag">
                    {entry.price
                      ? `${t("Price", "السعر")}: ${entry.price} ${u.currency}`
                      : t("No price listed", "لا يوجد سعر")}
                  </div>
                  
                  {/* WEBSITE LINK */}
                  <a href={u.website} target="_blank" rel="noopener noreferrer" className="website-link">
                    {t("Visit Website", "زيارة الموقع")}
                  </a>

                </div>
              );
            })}
          </div>
        )}

      </div>
    </div>
  );
}

// ==========================================================
//     RENDER APP TO SCREEN
// ==========================================================

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
